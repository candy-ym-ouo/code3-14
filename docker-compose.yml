services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balcony
      POSTGRES_USER: balcony
      POSTGRES_PASSWORD: balcony
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcony -d balcony"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/balcony-photos &&
      mc anonymous set none local/balcony-photos
      "

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_INTERNAL_URL:-postgresql://balcony:balcony@postgres:5432/balcony?schema=public}
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: ${COMPOSE_APP_BASE_URL:-http://localhost:8080}
      API_BASE_URL: ${COMPOSE_API_BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_INTERNAL_URL:-postgresql://balcony:balcony@postgres:5432/balcony?schema=public}
      REDIS_URL: ${REDIS_INTERNAL_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-with-a-long-random-production-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-balcony-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-15728640}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Balcony <no-reply@example.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${COMPOSE_APP_BASE_URL:-http://localhost:8080}
      API_BASE_URL: ${COMPOSE_API_BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_INTERNAL_URL:-postgresql://balcony:balcony@postgres:5432/balcony?schema=public}
      REDIS_URL: ${REDIS_INTERNAL_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-with-a-long-random-production-secret}
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-balcony-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-15728640}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Balcony <no-reply@example.com>}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
